[project]
name = "order-dependency"
version = "0.1.0"
description = "Measure how sensitive an LLM's multiple-choice answers are to the order of the answer options (ODS)."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.60",
    "huggingface_hub>=0.30",
    "jinja2>=3.1.6",
    "pandas>=2.2",
    "pyarrow>=15",
    "pydantic>=2",
    "tabulate>=0.10.0",
    "tqdm>=4.66",
]

[project.scripts]
order-dependency = "order_dependency.__main__:main"

[dependency-groups]
dev = [
    "ruff>=0.8",
]
# Local Hugging Face backend (--backend hf). Install with `uv sync --group hf`.
hf = [
    "torch>=2.4",
    "transformers>=4.45",
    "accelerate>=1.0",
    "bitsandbytes>=0.46.1"
]

# CUDA 12.8 wheels for torch (the default PyPI wheel is CPU-only on Windows).
[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/order_dependency"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# E/F: pyflakes + pycodestyle errors; I: sorted, grouped imports; TID252: no relative imports;
# D: every module/class/function has a Google-style docstring.
select = ["E", "F", "I", "TID252", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
known-first-party = ["order_dependency"]
